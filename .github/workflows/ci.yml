name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  superproject:
    name: Superproject (submodules + compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify all components present
        run: |
          test -f LieShouCloud-common/services/pom.xml
          test -f LieShouCloud-jwt-support/services/pom.xml
          for svc in gateway user admin auth approval; do
            test -f LieShouCloud-$svc-services/services/$svc/pom.xml
          done
          test -f LieShouCloud-admin-web/package.json
          echo "all components present ✓"
      - name: Validate docker-compose syntax
        run: docker compose -f deploy/docker-compose.yml config --quiet

  e2e:
    name: E2E (full stack + admin-web Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: LieShouCloud-admin-web/pnpm-lock.yaml
      - name: Build admin-web (frontend dist for nginx)
        working-directory: LieShouCloud-admin-web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Start full stack
        run: docker compose -f deploy/docker-compose.yml up -d --build
      - name: Wait for gateway healthy
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/actuator/health || true)
            [ "$code" = "200" ] && echo "gateway ready" && break
            echo "waiting ($i)..."; sleep 10
          done
          curl -sf http://localhost:9000/actuator/health
      - name: Seed multi-tenant data (acme tenant for tenant-switch e2e)
        run: |
          docker compose -f deploy/docker-compose.yml exec -T postgres psql -U postgres -d lieshoucloud <<'SQL'
          INSERT INTO tenants (name, code) VALUES ('Acme 集团', 'acme') ON CONFLICT (code) DO NOTHING;
          INSERT INTO users (tenant_id, username, display_name, email, password_hash, status)
          SELECT t.id, 'admin', 'Acme 管理员', 'admin@acme.test', src.password_hash, 'ACTIVE'
          FROM tenants t
          CROSS JOIN (SELECT password_hash FROM users WHERE username='admin' AND tenant_id=(SELECT id FROM tenants WHERE code='huntercat')) src
          WHERE t.code='acme' ON CONFLICT (tenant_id, username) DO NOTHING;
          INSERT INTO user_roles (user_id, role_id)
          SELECT u.id, r.id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.code='acme'
          JOIN roles r ON r.code='TENANT_ADMIN' WHERE u.username='admin' ON CONFLICT DO NOTHING;
          SQL
      - name: Run Playwright e2e
        working-directory: LieShouCloud-admin-web
        run: npx playwright install chromium && pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:8080
