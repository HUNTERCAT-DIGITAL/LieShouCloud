# 猎手云开源交付包 · 一键全栈编排
# 组合:infra(postgres/nacos)+ core 后端(gateway/auth/user/admin/approval)+ 前端(admin-web)
# 构建上下文指向各组件 submodule

services:
  # ============================================================
  # 基础设施
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: lieshoucloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lieshoucloud
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: lieshoucloud-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks: [backend]

  # ============================================================
  # core 后端(LieShouCloud-core)
  # ============================================================
  user:
    build:
      context: ./LieShouCloud-core/services
      dockerfile: user/Dockerfile
    image: lieshoucloud/user:dev
    container_name: lieshoucloud-user
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks: [backend]

  admin:
    build:
      context: ./LieShouCloud-core/services
      dockerfile: admin/Dockerfile
    image: lieshoucloud/admin:dev
    container_name: lieshoucloud-admin
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks: [backend]

  auth:
    build:
      context: ./LieShouCloud-core/services
      dockerfile: auth/Dockerfile
    image: lieshoucloud/auth:dev
    container_name: lieshoucloud-auth
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks: [backend]

  approval:
    build:
      context: ./LieShouCloud-core/services
      dockerfile: approval/Dockerfile
    image: lieshoucloud/approval:dev
    container_name: lieshoucloud-approval
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks: [backend]

  gateway:
    build:
      context: ./LieShouCloud-core/services
      dockerfile: gateway/Dockerfile
    image: lieshoucloud/gateway:dev
    container_name: lieshoucloud-gateway
    restart: unless-stopped
    depends_on:
      auth: { condition: service_started }
      user: { condition: service_started }
      admin: { condition: service_started }
      approval: { condition: service_started }
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 50s
    networks: [backend]

  # ============================================================
  # 前端(admin-web 构建产物 nginx 托管)
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: lieshoucloud-nginx
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_started }
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # admin-web 构建产物(先:cd LieShouCloud-admin-web && pnpm build)
      - ./LieShouCloud-admin-web/dist:/usr/share/nginx/html:ro
      - ./deploy/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]

volumes:
  pgdata:
    name: lieshoucloud-pgdata
  nacos_data:
    name: lieshoucloud-nacos-data
  nacos_logs:
    name: lieshoucloud-nacos-logs

networks:
  backend:
    name: lieshoucloud-backend
