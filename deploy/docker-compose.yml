# 猎手云开源交付包 · 一键全栈编排
# 组合:infra(postgres/nacos)+ core 后端(gateway/auth/user/admin/approval)+ 前端(admin-web)
# 构建上下文指向各组件 submodule

services:
  # ============================================================
  # 基础设施
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: lieshoucloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lieshoucloud
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: lieshoucloud-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks: [backend]

  # ============================================================
  # core 后端(lieshou-cloud-core)
  # ============================================================
  user:
    build:
      context: ../lieshou-cloud-user-services/services
      dockerfile: user/Dockerfile
    image: lieshoucloud/user:dev
    container_name: lieshoucloud-user
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      POSTGRES_DB: lieshoucloud
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks: [backend]

  admin:
    build:
      context: ../lieshou-cloud-admin-services/services
      dockerfile: admin/Dockerfile
    image: lieshoucloud/admin:dev
    container_name: lieshoucloud-admin
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      POSTGRES_DB: lieshoucloud
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks: [backend]

  auth:
    build:
      context: ../lieshou-cloud-auth-services/services
      dockerfile: auth/Dockerfile
    image: lieshoucloud/auth:dev
    container_name: lieshoucloud-auth
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      POSTGRES_DB: lieshoucloud
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks: [backend]

  approval:
    build:
      context: ../lieshou-cloud-approval-services/services
      dockerfile: approval/Dockerfile
    image: lieshoucloud/approval:dev
    container_name: lieshoucloud-approval
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      POSTGRES_DB: lieshoucloud
    depends_on:
      postgres: { condition: service_healthy }
      nacos: { condition: service_healthy }
    networks: [backend]

  gateway:
    build:
      context: ../lieshou-cloud-gateway-services/services
      dockerfile: gateway/Dockerfile
    image: lieshoucloud/gateway:dev
    container_name: lieshoucloud-gateway
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      # 开源交付包：不注册闭源行业服务路由（crm/inventory/finance/file/iot/device-gateway）
      LSC_INDUSTRY_ROUTES_ENABLED: "false"
      # CORS 白名单（浏览器 preflight 校验；缺省不含公网域名会导致登录 Failed to fetch）
      CORS_ALLOWED_ORIGINS: "https://lieshoucloud.huntercat.cn,http://localhost:5173,http://localhost:8080"
    depends_on:
      auth: { condition: service_started }
      user: { condition: service_started }
      admin: { condition: service_started }
      approval: { condition: service_started }
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    networks: [backend]

  # ============================================================
  # 前端(admin-web 构建产物 nginx 托管)
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: lieshoucloud-nginx
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_started }
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # admin-web 构建产物(先:cd lieshou-admin-web && pnpm build)
      - ../lieshou-admin-web/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]

volumes:
  pgdata:
    name: lieshoucloud-pgdata
  nacos_data:
    name: lieshoucloud-nacos-data
  nacos_logs:
    name: lieshoucloud-nacos-logs

networks:
  backend:
    name: lieshoucloud-backend
